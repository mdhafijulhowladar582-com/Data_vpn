name: Build APK

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # রিপোতে firewall_app.zip থাকলে খুলে নেয়। কোড সরাসরি আপলোড করা থাকলে এই ধাপ কিছু করে না।
      - name: zip খোলা
        run: |
          if [ -f firewall_app.zip ]; then
            unzip -oq firewall_app.zip
          fi
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # repo-তে শুধু lib, pubspec আর android/app/src আছে, বাকি Gradle কাঠামো flutter create বানায়।
      # নিজের Kotlin, Manifest, res আগে সরিয়ে রেখে পরে আবার বসাই।
      - name: Android কাঠামো বানানো
        run: |
          mkdir -p /tmp/keep
          if [ -d android/app/src/main ]; then
            cp -r android/app/src/main/. /tmp/keep/
          else
            echo "::error::android/app/src/main নেই, কোড পাওয়া যায়নি"
            exit 1
          fi
          flutter create --platforms=android --org com.you --project-name firewall .
          cp -r /tmp/keep/. android/app/src/main/
          ls android/app/src/main/kotlin/com/you/firewall/ | head -40

      - name: minSdk ২৩ করা
        run: |
          f=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -n1)
          sed -i -E 's/minSdk(Version)? *(=)? *[A-Za-z0-9_.()]+/minSdk = 23/' "$f"
          grep -n "minSdk" "$f"

      - run: flutter pub get

      - name: APK বিল্ড
        run: flutter build apk --release

      # সই: Secrets থাকলে নিজের key দিয়ে সই করা APK, না থাকলে আগের মতো debug key-র APK
      - name: APK সই করা
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          IN=build/app/outputs/flutter-apk/app-release.apk
          OUT=firewall.apk
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > /tmp/release.jks
            APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner
            "$APKSIGNER" sign --ks /tmp/release.jks --ks-key-alias "$KS_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "$OUT" "$IN"
            "$APKSIGNER" verify --print-certs "$OUT" | head -3
            rm -f /tmp/release.jks
          else
            echo "::warning::Secrets নেই, তাই debug key-তে সই করা APK হচ্ছে"
            cp "$IN" "$OUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: firewall-apk
          path: firewall.apk

      # ডাউনলোড লিংকের জন্য Releases-এ রাখা
      - name: Release বানানো
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" firewall.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "স্বয়ংক্রিয় build, commit ${GITHUB_SHA::7}"
