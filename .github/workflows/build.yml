name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: জিপ খোলা
        run: |
          unzip -o firewall_app.zip -x ".github/*"
          echo "--- রুট ---"
          ls
          echo "--- Kotlin ফাইল ---"
          ls android/app/src/main/kotlin/com/you/firewall/ | wc -l
          test -f pubspec.yaml
          test -f android/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android কাঠামো বানানো
        run: |
          mkdir -p /tmp/keep
          cp -r android/app/src/main/. /tmp/keep/
          flutter create --platforms=android --org com.you --project-name firewall .
          cp -r /tmp/keep/. android/app/src/main/
          ls android/app/src/main/kotlin/com/you/firewall/ | head -30

      - name: minSdk ২৩ করা
        run: |
          f=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -n1)
          sed -i -E 's/minSdk(Version)? *(=)? *[A-Za-z0-9_.()]+/minSdk = 23/' "$f"
          grep -n "minSdk" "$f"

      - run: flutter pub get

      - name: APK বিল্ড
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: firewall-apk
          path: build/app/outputs/flutter-apk/app-release.apk
