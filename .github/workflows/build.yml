name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter project বানিয়ে আমাদের ফাইল বসানো
        run: |
          flutter create --org com.you --project-name firewall --platforms android build_app
          rm -rf build_app/lib
          cp -r lib build_app/lib
          cp pubspec.yaml build_app/pubspec.yaml
          K=build_app/android/app/src/main/kotlin/com/you/firewall
          mkdir -p $K
          rm -f $K/*.kt
          cp android/app/src/main/kotlin/com/you/firewall/*.kt $K/
          cp android/app/src/main/AndroidManifest.xml build_app/android/app/src/main/AndroidManifest.xml
      - name: Build
        run: |
          cd build_app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: firewall-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
