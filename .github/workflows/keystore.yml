name: Keystore বানানো (একবারই চালাবে)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Keystore তৈরি
        run: |
          mkdir out
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore out/release.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 -alias firewall \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Firewall, OU=App, O=You, L=Dhaka, C=BD"
          base64 -w0 out/release.jks > out/KEYSTORE_BASE64.txt
          echo -n "$PASS" > out/KEYSTORE_PASSWORD.txt
          echo -n "firewall" > out/KEY_ALIAS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-ONLY-ONCE
          path: out/
          retention-days: 1
